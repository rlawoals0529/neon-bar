<!doctype html>
<html lang="en" data-theme="rain-lantern">
<head>
<meta charset="utf-8">
<title>Neon bar</title>
<!-- Every palette in one file, each scoped to [data-theme], so switching is one attribute
     write and the bar needs no build step to do it. Vendored from yozora. -->
<link rel="stylesheet" href="../theme/palettes.css">
<!-- Solved, not chosen. See scripts/bar-alpha.mjs. -->
<link rel="stylesheet" href="../theme/bar-alpha.css">
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="bar">
    <div class="left">
      <div class="ws"></div>
    </div>
    <div class="mid">
      <div class="chip media"></div>
    </div>
    <div class="right">
      <div class="chip cpu"></div>
      <div class="chip mem"></div>
      <div class="chip net"></div>
      <div class="chip batt"></div>
      <div class="chip weather"></div>
      <div class="chip clock"></div>
    </div>
  </div>
  <script type="module" src="./bar.js"></script>
</body>
</html>
