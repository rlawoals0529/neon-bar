<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neon bar — preview</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 26px;
         background: #0a0a0f radial-gradient(1200px 500px at 50% -10%, #1b1030, #0a0a0f) no-repeat;
         font: 13px system-ui, sans-serif; color: #6f6f88; padding: 40px 0; }
  .frame { width: min(1180px, 94vw); height: 38px; border-radius: 10px; overflow: hidden;
           box-shadow: 0 18px 50px rgba(0,0,0,.55); }
  iframe { width: 100%; height: 100%; border: 0; }
  .swatches { display: flex; gap: 10px; }
  .swatches button { all: unset; width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
                     border: 2px solid rgba(255,255,255,.15); }
</style>
</head>
<body>
  <div class="frame"><iframe id="bar" src="../bar/index.html"></iframe></div>
  <div class="swatches">
    <button style="background:#ff4d8d" data-accent="#ff4d8d" title="rose"></button>
    <button style="background:#4dd6ff" data-accent="#4dd6ff" title="ice"></button>
    <button style="background:#9d7bff" data-accent="#9d7bff" title="violet"></button>
    <button style="background:#7bffb2" data-accent="#7bffb2" title="mint"></button>
    <button style="background:#ffb84d" data-accent="#ffb84d" title="amber"></button>
  </div>
  <p>Retheming is one custom property. The bar itself is <code>bar/</code>; this page only frames it.</p>
  <script>
    document.querySelector(".swatches").addEventListener("click", (e) => {
      const accent = e.target.dataset.accent;
      if (!accent) return;
      const doc = document.getElementById("bar").contentDocument;
      doc.documentElement.style.setProperty("--accent", accent);
    });
  </script>
</body>
</html>
